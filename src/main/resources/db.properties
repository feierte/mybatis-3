jdbc.driver=org.h2.Driver
# jdbc:h2:mem:testdb: 表示创建一个名为 testdb 的内存数据库
# DB_CLOSE_DELAY=-1: 当最后一个连接关闭时，不销毁数据库（对于测试很有用）
# DB_CLOSE_ON_EXIT=FALSE: JVM 退出时不自动关闭数据库
# jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# 创建一个持久化数据库
# ./ 代表当前工作目录，即你的项目根目录。
jdbc.url=jdbc:h2:./data/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
jdbc.username=sa
jdbc.password=